name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: natures-appetite
          path: build/libs/natures_appetite-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_TOKEN_2: ${{ secrets.MODRINTH_TOKEN_2 }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Resolve release jar
        id: release_jar
        shell: bash
        run: |
          JAR_PATH=$(ls build/libs/natures_appetite-*.jar | grep -v '\-sources\.jar' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No release jar found in build/libs"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved jar: $JAR_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_jar.outputs.jar_path }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        if: ${{ (env.MODRINTH_TOKEN != '' || env.MODRINTH_TOKEN_2 != '') && env.MODRINTH_PROJECT_ID != '' }}
        run: |
          export MODRINTH_TOKEN="${MODRINTH_TOKEN:-$MODRINTH_TOKEN_2}"
          chmod +x ./gradlew
          ./gradlew modrinth -Pmodrinth_project_id=${{ env.MODRINTH_PROJECT_ID }}

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != '' }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ env.CURSEFORGE_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: ${{ steps.release_jar.outputs.jar_path }}
          game_versions: "Minecraft 1.21:1.21.1,Java 21,NeoForge"
